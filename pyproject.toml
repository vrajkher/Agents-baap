[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agents"
version = "0.1.0"
description = "Hermes Autonomous Agent OS — build, manage, and evolve intelligent agents."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Agents-baap" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
graphiti = ["graphiti-core"]

[tool.setuptools.packages.find]
include = ["hermes*"]
